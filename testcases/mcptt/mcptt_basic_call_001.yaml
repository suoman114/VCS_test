# McPTT 기본 호처리 시험 케이스 정의 예시
# 스키마 소유: testcase-manager-agent (참고: backend/app/schemas/test_case.py)

id: mcptt-basic-call-001
name: "McPTT 기본 호처리 - 그룹 호 발신/Floor 획득/종료"
category: mcptt
test_type: basic_call
description: >
  SIPp로 McPTT 그룹 호를 발생시키고 Floor Request/Granted 및 정상 종료
  흐름이 규격대로 동작하는지 확인한다.

# McPTT는 config_ref가 메인 SIPp 시나리오(XML) 경로를 가리킨다.
# 시나리오 자체(메시지 흐름/조건분기)는 sipp-scenario-agent가 관리한다.
config_ref: "scenarios/sipp/mcptt_basic_call.xml"

protocol_params:
  # SIPp는 VCS와 별도인 전용 호스트에서 실행된다 (2026-07-29 확인) — sipp_exec_mode를
  # "ssh"로 지정하면 SIPP_SSH_* 설정(.env)의 호스트에 시나리오를 업로드하고 원격 실행한다.
  # 생략하면 Settings.sipp_exec_mode(기본 "local")를 따른다.
  sipp_exec_mode: "ssh"
  target_ip: "10.0.0.10"
  target_port: 5060
  call_rate: 1
  max_calls: 10
  extra_sipp_args:
    - "-trace_msg"
    - "-trace_screen"
  # vcmc_log_path/vcmm_log_path 기본값은 Settings(app/core/config.py)에 있으므로 생략 가능.

pass_criteria:
  required_events:
    - SIP_INVITE
    - SIP_200OK
    - MCPTT_FLOOR_GRANTED
    - SIP_BYE
  forbidden_patterns:
    - "ERROR"
  max_duration_sec: 60
